<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html, body {
    width: 1280px;
    height: 670px;
    overflow: hidden;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    background: #F1F5F9;
    color: #0A1D37;
    -webkit-font-smoothing: antialiased;
  }

  .poster {
    position: relative;
    width: 1280px;
    height: 670px;
    overflow: hidden;
    background: #EEF2F6;
  }

  /* Full-canvas natural studio photograph (no hard cut / no artificial white wall) */
  .bg-photo {
    position: absolute;
    inset: 0;
    width: 1280px;
    height: 670px;
    z-index: 1;
  }

  .bg-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 82% 28%;
    transform: scale(1.06) translateX(52px);
    display: block;
    filter: contrast(1.05) saturate(0.96);
  }

  /* Soft natural studio light veil on the left only (preserves background depth & patient leg) */
  .studio-veil {
    position: absolute;
    inset: 0;
    z-index: 2;
    background:
      radial-gradient(ellipse 64% 92% at 16% 34%, rgba(248, 250, 252, 0.88) 0%, rgba(248, 250, 252, 0.70) 48%, rgba(248, 250, 252, 0.0) 88%),
      linear-gradient(90deg, rgba(244, 247, 251, 0.72) 0%, rgba(244, 247, 251, 0.45) 36%, rgba(244, 247, 251, 0.0) 62%);
    pointer-events: none;
  }

  /* Subtle bottom-right contrast vignette for white brand text */
  .brand-vignette {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 440px;
    height: 90px;
    z-index: 3;
    background: radial-gradient(ellipse at 90% 100%, rgba(10, 29, 55, 0.62) 0%, transparent 72%);
    pointer-events: none;
  }

  /* Thin editorial top accent hairline */
  .top-hairline {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
    z-index: 7;
    background: linear-gradient(90deg, #0A1D37 0%, #0A1D37 42%, #FACC15 42%, #FACC15 62%, rgba(10, 29, 55, 0.2) 100%);
  }

  /* EDITORIAL HEADLINE ZONE (No boxy rounded pills, pure typographic authority) */
  .headline-zone {
    position: absolute;
    left: 48px;
    top: 38px;
    width: 720px;
    z-index: 5;
  }

  .hook-line {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    font-weight: 900;
    color: #0F2342;
    letter-spacing: 0.04em;
    margin-bottom: 14px;
    text-shadow: 0 1px 12px rgba(255, 255, 255, 0.95);
  }
  .hook-bar {
    width: 5px;
    height: 24px;
    background: #DC2626;
    display: inline-block;
  }

  .title-lead {
    font-size: 38px;
    font-weight: 900;
    line-height: 1.25;
    color: #1E293B;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
    text-shadow: 0 2px 14px rgba(255, 255, 255, 0.95);
  }

  /* Oversized Hero Typography with organic yellow brush stroke */
  .title-hero {
    position: relative;
    display: flex;
    align-items: baseline;
    gap: 10px;
    line-height: 1.04;
    margin: 4px 0 8px 0;
  }

  .hero-term {
    position: relative;
    display: inline-block;
    font-size: 92px;
    font-weight: 900;
    letter-spacing: -0.04em;
    color: #0A1D37;
    z-index: 2;
    text-shadow:
      0 2px 0 rgba(255, 255, 255, 0.92),
      0 8px 22px rgba(10, 29, 55, 0.22);
  }

  .hero-term.pelvis {
    color: #0369A1;
  }

  /* Organic brush-stroke highlight behind hero words */
  .brush-svg {
    position: absolute;
    left: -10px;
    bottom: -4px;
    width: calc(100% + 20px);
    height: 46px;
    z-index: -1;
    pointer-events: none;
  }

  .hero-conj {
    font-size: 52px;
    font-weight: 900;
    color: #334155;
    text-shadow: 0 2px 12px rgba(255, 255, 255, 0.95);
  }

  .title-tail {
    font-size: 46px;
    font-weight: 900;
    line-height: 1.15;
    color: #0A1D37;
    letter-spacing: -0.02em;
    text-shadow: 0 2px 14px rgba(255, 255, 255, 0.95);
  }

  /* BOTTOM-LEFT: Precision Scientific sEMG Oscilloscope Panel */
  .emg-panel {
    position: absolute;
    left: 48px;
    bottom: 28px;
    width: 524px;
    height: 214px;
    z-index: 5;
    background: rgba(10, 24, 46, 0.92);
    border: 1px solid rgba(56, 189, 248, 0.35);
    border-top: 3px solid #0EA5E9;
    border-radius: 4px;
    padding: 12px 16px 12px 16px;
    box-shadow: 0 16px 36px rgba(10, 24, 46, 0.26);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    backdrop-filter: blur(6px);
  }

  .emg-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(148, 163, 184, 0.20);
    padding-bottom: 7px;
  }

  .emg-title {
    font-size: 15px;
    font-weight: 800;
    color: #F1F5F9;
    letter-spacing: 0.03em;
  }

  .emg-legend {
    display: flex;
    gap: 14px;
    font-size: 13px;
    font-weight: 700;
    color: #CBD5E1;
  }
  .leg {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .leg-line {
    width: 14px;
    height: 3px;
    border-radius: 2px;
  }

  .emg-waves-wrap {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 22px 1fr;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }

  .wave-col {
    display: flex;
    flex-direction: column;
    height: 100%;
    justify-content: space-between;
  }

  .wave-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 4px;
  }

  .wave-canvas-box {
    position: relative;
    width: 100%;
    height: 126px;
    background: rgba(6, 15, 30, 0.85);
    border: 1px solid rgba(148, 163, 184, 0.18);
    border-radius: 3px;
    overflow: hidden;
  }
  .wave-canvas-box.ok {
    border-color: rgba(56, 189, 248, 0.45);
  }

  .wave-arrow {
    text-align: center;
    font-size: 20px;
    font-weight: 900;
    color: #FACC15;
    padding-top: 16px;
  }

  /* Full-canvas biomechanical vector overlay */
  .bio-svg {
    position: absolute;
    inset: 0;
    width: 1280px;
    height: 670px;
    z-index: 4;
    pointer-events: none;
  }

  /* Minimal Sharp Editorial Footer */
  .brand-footer {
    position: absolute;
    right: 26px;
    bottom: 16px;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .hashtags {
    font-size: 15px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.92);
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
    letter-spacing: 0.03em;
  }

  .brand-divider {
    width: 1px;
    height: 16px;
    background: rgba(255, 255, 255, 0.45);
  }

  .brand-name {
    font-size: 17px;
    font-weight: 900;
    color: #FACC15;
    letter-spacing: 0.06em;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.72);
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="top-hairline"></div>

    <!-- Full-canvas studio clinical photo -->
    <div class="bg-photo">
      <img src="./header_photo.jpg" alt="側臥位ヒップアブダクションの臨床評価" />
    </div>

    <!-- Soft natural light veil (preserves studio depth) -->
    <div class="studio-veil"></div>
    <div class="brand-vignette"></div>

    <!-- EDITORIAL TYPOGRAPHY (No rounded boxes, high jump ratio, brush highlight) -->
    <div class="headline-zone">
      <div class="hook-line">
        <span class="hook-bar"></span>
        TFL・腰方形筋ばかり張る人へ
      </div>

      <div class="title-lead">中臀筋は、鍛える前に</div>

      <div class="title-hero">
        <span class="hero-term">
          腹圧
          <svg class="brush-svg" viewBox="0 0 210 36" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 4 24 Q 52 14, 108 19 T 204 15 L 207 30 Q 150 34, 98 30 T 3 33 Z" fill="#FDE047" opacity="0.92" />
          </svg>
        </span>
        <span class="hero-conj">と</span>
        <span class="hero-term pelvis">
          骨盤
          <svg class="brush-svg" viewBox="0 0 210 36" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 4 22 Q 60 15, 112 20 T 205 16 L 207 31 Q 145 34, 95 29 T 2 32 Z" fill="#FDE047" opacity="0.92" />
          </svg>
        </span>
      </div>

      <div class="title-tail">をセットせよ</div>
    </div>

    <!-- BOTTOM-LEFT: Precision sEMG Oscilloscope Panel -->
    <div class="emg-panel">
      <div class="emg-head">
        <div class="emg-title">筋電図（EMG）活動バランス比較</div>
        <div class="emg-legend">
          <span class="leg"><span class="leg-line" style="background:#38BDF8;"></span>中臀筋</span>
          <span class="leg"><span class="leg-line" style="background:#FB7185;"></span>TFL・腰方形筋</span>
        </div>
      </div>

      <div class="emg-waves-wrap">
        <!-- Left: Unstabilized -->
        <div class="wave-col">
          <div class="wave-header">
            <span style="color:#CBD5E1;">通常外転</span>
            <span style="color:#FB7185; font-size:12px;">TFL / QL 過活動</span>
          </div>
          <div class="wave-canvas-box">
            <svg id="emg-before" viewBox="0 0 228 126" width="228" height="126" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
        </div>

        <div class="wave-arrow">→</div>

        <!-- Right: Bracing + Neutral Pelvis -->
        <div class="wave-col">
          <div class="wave-header">
            <span style="color:#FFFFFF;">腹圧＋骨盤セット後</span>
            <span style="color:#38BDF8; font-size:12px;">中臀筋 優位</span>
          </div>
          <div class="wave-canvas-box ok">
            <svg id="emg-after" viewBox="0 0 228 126" width="228" height="126" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
        </div>
      </div>
    </div>

    <!-- SHARP BIOMECHANICAL OVERLAY (Editorial Callout Lines, No Boxy Pills) -->
    <svg class="bio-svg" viewBox="0 0 1280 670" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
        </marker>
        <marker id="arrCyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
        </marker>
        <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0A1D37" flood-opacity="0.72" />
        </filter>
      </defs>

      <!-- OK: Pelvis neutral vertical axis (aligned to iliac crest / waistband) -->
      <line x1="894" y1="316" x2="894" y2="578" stroke="#FACC15" stroke-width="3" stroke-dasharray="7 5" />
      <line x1="884" y1="316" x2="904" y2="316" stroke="#FACC15" stroke-width="2.5" />
      <line x1="884" y1="578" x2="904" y2="578" stroke="#FACC15" stroke-width="2.5" />
      <circle cx="894" cy="444" r="6" fill="#FACC15" stroke="#0A1D37" stroke-width="2" />

      <!-- NG: Sharp Red Curved Compensation Arrow (Pelvic hiking / cranial tilt) -->
      <path d="M 920 434 Q 988 380 1054 394" fill="none" stroke="#EF4444" stroke-width="4" stroke-linecap="round" marker-end="url(#arrRed)" />

      <!-- OK: Precision Target Reticle on Gluteus Medius + Abduction Vector -->
      <circle cx="786" cy="462" r="34" fill="rgba(2, 132, 199, 0.14)" stroke="#0284C7" stroke-width="2.5" />
      <circle cx="786" cy="462" r="20" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="4 3" />
      <circle cx="786" cy="462" r="5" fill="#38BDF8" />
      <line x1="786" y1="462" x2="526" y2="366" stroke="#0284C7" stroke-width="3.5" marker-end="url(#arrCyan)" />

      <!-- Sharp Editorial Callout 1: NG Compensation (line + clean dark strip, no pill) -->
      <polyline points="1018,384 1044,344 1236,344" fill="none" stroke="#EF4444" stroke-width="2.2" />
      <rect x="1044" y="310" width="192" height="32" fill="rgba(127, 29, 29, 0.90)" />
      <text x="1140" y="332" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="900" font-family="Hiragino Sans, sans-serif">× 骨盤の引き上げ代償</text>

      <!-- Sharp Editorial Callout 2: OK Stabilization (clear of vertical yellow axis) -->
      <polyline points="798,494 820,536 914,536" fill="none" stroke="#FACC15" stroke-width="2.2" />
      <rect x="914" y="518" width="204" height="34" fill="rgba(10, 29, 55, 0.90)" />
      <text x="1016" y="541" text-anchor="middle" fill="#FACC15" font-size="16" font-weight="900" font-family="Hiragino Sans, sans-serif">◎ 腸骨固定 → 中臀筋</text>
    </svg>

    <!-- Minimal Editorial Footer -->
    <div class="brand-footer">
      <span class="hashtags">#理学療法士 &nbsp;#中臀筋</span>
      <span class="brand-divider"></span>
      <span class="brand-name">benita_pt</span>
    </div>
  </div>

  <!-- Procedural High-Density Realistic sEMG Waveform Generator -->
  <script>
    (function () {
      function makeSeededRandom(seed) {
        let s = seed % 2147483647;
        if (s <= 0) s += 2147483646;
        return function () {
          s = (s * 16807) % 2147483647;
          return (s - 1) / 2147483646;
        };
      }

      function buildWavePath(width, centerY, maxAmp, seed, burstStart, burstEnd) {
        const rand = makeSeededRandom(seed);
        const pts = [];
        const step = 1.6;
        for (let x = 2; x <= width - 2; x += step) {
          const norm = x / width;
          // Smooth bell-like contraction envelope
          let env = 0.08;
          if (norm >= burstStart && norm <= burstEnd) {
            const t = (norm - burstStart) / (burstEnd - burstStart);
            env = 0.12 + 0.88 * Math.pow(Math.sin(Math.PI * t), 0.72);
          }
          // Realistic high-frequency multiphasic sEMG spikes
          const polarity = (Math.floor(x / step) % 2 === 0 ? 1 : -1);
          const spike = (0.25 + 0.75 * Math.pow(rand(), 0.65)) * maxAmp * env * polarity;
          const jitter = (rand() - 0.5) * 2.2;
          const y = centerY + spike + jitter;
          pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
        }
        return pts.join(" ");
      }

      function renderOscilloscope(svgId, cfg) {
        const svg = document.getElementById(svgId);
        const W = 228, H = 126;
        let html = "";

        // Fine oscilloscope grid
        for (let x = 19; x < W; x += 19) {
          html += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="rgba(148,163,184,0.10)" stroke-width="1" />`;
        }
        for (let y = 21; y < H; y += 21) {
          html += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="rgba(148,163,184,0.10)" stroke-width="1" />`;
        }

        // Channel separator
        html += `<line x1="0" y1="63" x2="${W}" y2="63" stroke="rgba(148,163,184,0.28)" stroke-width="1" />`;
        // Center baselines
        html += `<line x1="0" y1="33" x2="${W}" y2="33" stroke="rgba(56,189,248,0.22)" stroke-width="1" stroke-dasharray="3 3" />`;
        html += `<line x1="0" y1="95" x2="${W}" y2="95" stroke="rgba(251,113,133,0.22)" stroke-width="1" stroke-dasharray="3 3" />`;

        // Channel 1: Gluteus Medius (top half, cyan)
        const gmedPts = buildWavePath(W, 33, cfg.gmedAmp, cfg.seed1, 0.14, 0.88);
        html += `<polyline fill="none" stroke="#38BDF8" stroke-width="1.35" stroke-linejoin="round" points="${gmedPts}" />`;

        // Channel 2: TFL / QL (bottom half, rose-red)
        const tflPts = buildWavePath(W, 95, cfg.tflAmp, cfg.seed2, 0.10, 0.90);
        html += `<polyline fill="none" stroke="#FB7185" stroke-width="1.35" stroke-linejoin="round" points="${tflPts}" />`;

        // Minimal channel tags inside corner
        html += `<text x="6" y="13" fill="#7DD3FC" font-size="10" font-weight="800" font-family="Hiragino Sans, sans-serif">中臀筋</text>`;
        html += `<text x="6" y="76" fill="#FDA4AF" font-size="10" font-weight="800" font-family="Hiragino Sans, sans-serif">TFL・QL</text>`;

        svg.innerHTML = html;
      }

      renderOscilloscope("emg-before", { gmedAmp: 8, tflAmp: 25, seed1: 101, seed2: 202 });
      renderOscilloscope("emg-after", { gmedAmp: 26, tflAmp: 7, seed1: 303, seed2: 404 });
    })();
  </script>
</body>
</html>
