name: Daily X Post & Summary Card (19:45 JST)

on:
  schedule:
    # 10:45 UTC = 19:45 JST (Every day)
    - cron: '45 10 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（メール送信・履歴JSON更新・Pushをスキップし、生成物のみ確認）'
        required: false
        default: false
        type: boolean
      skip_nlm:
        description: 'nlm CLIをスキップし、リポジトリ内ナレッジベースから昼用投稿を生成'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-x-post
  cancel-in-progress: false

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Japanese Fonts and Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk google-chrome-stable || sudo apt-get install -y fonts-noto-cjk chromium-browser

      - name: Generate Night, Next Morning & Next Noon X Posts + Cards and Send Email
        env:
          RECIPIENT_EMAIL: itoshota2006@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o' }}
          NLM_NOTEBOOK_ID: ${{ vars.NLM_NOTEBOOK_ID || '' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_SKIP_NLM: ${{ inputs.skip_nlm }}
        run: |
          ARGS=()
          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "${INPUT_SKIP_NLM}" = "true" ]; then
            ARGS+=(--skip-nlm)
          fi
          python3 run_daily_x.py "${ARGS[@]}"

      - name: Upload Generated X Posts & Cards Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-x-output-${{ github.run_number }}
          path: |
            x_post_night.txt
            x_post_morning.txt
            x_post_noon.txt
            x_mail_daily.txt
            x_card_night.png
            x_card_morning.png
            x_rotation_state.json
            x_noon_history.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit and Push Updated Rotation State and Noon History
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x_rotation_state.json x_noon_history.json x_post_night.txt x_post_morning.txt x_post_noon.txt x_mail_daily.txt x_card_night.png x_card_morning.png
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update X rotation state and noon history ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin main
