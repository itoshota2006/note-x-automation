name: Daily X Post & Summary Card (19:45 JST)

on:
  schedule:
    # 10:45 UTC = 19:45 JST (Every day)
    - cron: '45 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Japanese Fonts and Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk google-chrome-stable || sudo apt-get install -y fonts-noto-cjk chromium-browser

      - name: Generate Evening & Next Morning X Posts + Cards and Send 2 Emails
        env:
          RECIPIENT_EMAIL: itoshota2006@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 run_daily_x.py

      - name: Commit and Push Updated Rotation State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x_rotation_state.json x_post_night.txt x_post_morning.txt x_card_night.png x_card_morning.png
          git diff --cached --quiet || git commit -m "chore: update X rotation state ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          git push
